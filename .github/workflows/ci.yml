name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SerializdSync.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.SerializdSync.sln -c Release --no-restore

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.SerializdSync
          path: Jellyfin.Plugin.SerializdSync/bin/Release/net9.0/Jellyfin.Plugin.SerializdSync.dll
